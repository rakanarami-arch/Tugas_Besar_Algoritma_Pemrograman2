<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f7ff 0%, #dfe7ff 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #112240;
        }

        .profile-card {
            width: min(420px, 90vw);
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(17, 34, 64, 0.18);
            overflow: hidden;
            text-align: center;
        }

        .profile-card__header {
            background: linear-gradient(160deg, #4f535d 0%, #6d1414 100%);
            padding: 38px 16px 24px;
        }

        .profile-card__avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 8px solid #ffffff;
            object-fit: cover;
            background: #dfe7ff;
        }

        .profile-card__body {
            padding: 24px 28px 32px;
        }

        .profile-card__name {
            margin: 16px 0 8px;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .profile-card__role {
            margin: 0;
            color: #5d6b8a;
            font-size: 0.96rem;
        }

        .profile-card__description {
            margin: 20px 0 24px;
            line-height: 1.7;
            color: #4b5874;
            font-size: 0.98rem;
        }

        .profile-card__list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            gap: 10px;
        }

        .profile-card__item {
            background: #f7f9ff;
            border-radius: 14px;
            padding: 14px 16px;
            color: #394b70;
            font-weight: 600;
        }

        .profile-card__footer {
            margin-top: 24px;
            font-size: 0.92rem;
            color: #6b7a99;
        }
    </style>
</head>
<body>
    <article class="profile-card">
        <div class="profile-card__header">
            <img class="profile-card__avatar" src="IMG-20260506-WA0043.jpg.jpeg" alt="Foto profil saya">
        </div>
        <div class="profile-card__body">
            <h1 class="profile-card__name">Muhammad Rakan Arami</h1>
            <p class="profile-card__role">Saya Merupakan Mahasiswa informatika Telkom University</p>
            <p class="profile-card__description">Halo! Saya seorang yang suka belajar dan berkreasi. Saya menyukai pemrograman, dan membuat sesuatu yang berguna untuk orang lain.</p>
            <ul class="profile-card__list">
                <li class="profile-card__item">Siap berkembang dan beradaptasi</li>
                <li class="profile-card__item">Siap belajar hal baru</li>
            </ul>
            <p class="profile-card__footer">Thank You!</p>
        </div>
    </article>
</body>
</html>
